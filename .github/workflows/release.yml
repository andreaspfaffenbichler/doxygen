name: Release Binaries

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-linux-gcc:
    name: Ubuntu GCC Release (Intel)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y libxapian-dev

    - name: Install Qt 5
      uses: jdpurcell/install-qt-action@v5
      with:
        version: 5.*

    - name: Configure
      env:
        CC: gcc
        CXX: g++
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -G "Unix Makefiles" \
          -Dbuild_search=YES \
          -Dbuild_wizard=YES

    - name: Build
      run: |
        cmake --build build --parallel $(nproc)

    - name: Package
      run: |
        VERSION=${{ steps.version.outputs.version }}
        ARCHIVE="doxygen-${VERSION}.linux.bin.tar.gz"
        mkdir -p "doxygen-${VERSION}/bin"
        cp build/bin/doxygen        "doxygen-${VERSION}/bin/doxygen"
        cp build/bin/doxywizard     "doxygen-${VERSION}/bin/doxywizard"
        cp build/bin/doxyindexer    "doxygen-${VERSION}/bin/doxyindexer"
        cp build/bin/doxysearch.cgi "doxygen-${VERSION}/bin/doxysearch.cgi"
        tar -czf "${ARCHIVE}" "doxygen-${VERSION}"
        echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARCHIVE }}

    - name: Upload artifact (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: doxygen-${{ steps.version.outputs.version }}.linux.bin
        path: ${{ env.ARCHIVE }}

  build-windows-msvc:
    name: Windows MSVC Release (x64)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      shell: bash
      run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

    - name: Install bison/flex
      run: choco install winflexbison3

    - name: Install Qt 5
      uses: jdpurcell/install-qt-action@v5
      with:
        version: 5.*

    - name: Setup VS Environment
      uses: step-security/gha-setup-vsdevenv@v6

    - name: Refresh environment
      shell: pwsh
      run: |
        Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
        refreshenv

    - name: Configure
      shell: cmd
      run: |
        cmake -S . -B build ^
          -DCMAKE_BUILD_TYPE=Release ^
          -G "NMake Makefiles" ^
          -Dbuild_wizard=YES

    - name: Build
      shell: cmd
      run: cmake --build build

    - name: Package
      shell: bash
      run: |
        VERSION=${{ steps.version.outputs.version }}
        ARCHIVE="doxygen-${VERSION}.windows.x64.bin.zip"
        mkdir -p "doxygen-${VERSION}/bin"
        cp build/bin/doxygen.exe    "doxygen-${VERSION}/bin/doxygen.exe"
        cp build/bin/doxywizard.exe "doxygen-${VERSION}/bin/doxywizard.exe"
        7z a "${ARCHIVE}" "doxygen-${VERSION}"
        echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARCHIVE }}

    - name: Upload artifact (workflow_dispatch)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: doxygen-${{ steps.version.outputs.version }}.windows.x64.bin
        path: ${{ env.ARCHIVE }}
